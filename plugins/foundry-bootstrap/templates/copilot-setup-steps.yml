name: Foundry optimizer Copilot setup

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/skills/foundry-agent-optimizer/**
      - .foundry-opt/registry.yaml
      - "**/.foundry/foundry-opt.yaml"

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    environment: copilot
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the agent repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true

      - name: Fetch and verify the exact optimizer runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_repository="__FOUNDRY_OPT_REPOSITORY__"
          runtime_commit="__FOUNDRY_OPT_COMMIT__"
          package_path="__FOUNDRY_OPT_PACKAGE_PATH__"
          expected_lock_sha256="__FOUNDRY_OPT_UV_LOCK_SHA256__"
          optimizer_skill_path="__FOUNDRY_OPT_OPTIMIZER_SKILL_PATH__"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"

          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$runtime_repository"
          git -C "$shared_root" fetch --depth=1 origin "$runtime_commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          test "$(git -C "$shared_root" rev-parse HEAD)" = "$runtime_commit"

          if [[ "$package_path" == "." ]]; then
            package_root="$shared_root"
          else
            package_root="$shared_root/$package_path"
          fi
          actual_lock_sha256="$(sha256sum "$package_root/uv.lock" | cut -d' ' -f1)"
          test "$actual_lock_sha256" = "$expected_lock_sha256"
          test -f "$shared_root/$optimizer_skill_path/SKILL.md"

          uv sync --frozen --project "$package_root"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$package_root" >>"$GITHUB_ENV"
          echo "$package_root/.venv/bin" >>"$GITHUB_PATH"

          project_skill_root="$GITHUB_WORKSPACE/.github/skills/foundry-agent-optimizer"
          test -f "$project_skill_root/SKILL.md"
          diff -qr "$shared_root/$optimizer_skill_path" "$project_skill_root"

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt preflight --repository . --offline

      - name: Record trusted optimizer state paths
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/foundry-opt-trusted"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root/broker" "$trusted_root/jobs"
          chmod 700 "$trusted_root" "$trusted_root/broker" "$trusted_root/jobs"
          echo "FOUNDRY_OPT_TRUSTED_ROOT=$trusted_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_GITHUB_BINDING=$trusted_root/broker/binding.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BROKER_SOCKET=$trusted_root/broker/github.sock" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_STATE_ROOT=$trusted_root/jobs" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_REGISTRY=$GITHUB_WORKSPACE/.foundry-opt/registry.yaml" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_RUNTIME_SHA=__FOUNDRY_OPT_COMMIT__" >>"$GITHUB_ENV"

      - name: Detect Copilot cloud-agent context
        id: job-context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "dynamic" ]]; then
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Launch the issue broker
        if: ${{ steps.job-context.outputs.trusted == 'true' }}
        env:
          GITHUB_SETUP_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SETUP_TOKEN" | \
            foundry-opt broker launch \
              --event "$GITHUB_EVENT_PATH" \
              --binding "$FOUNDRY_OPT_GITHUB_BINDING" \
              --socket "$FOUNDRY_OPT_BROKER_SOCKET" \
              --head-ref "${GITHUB_HEAD_REF:-}" \
              --ref-name "${GITHUB_REF_NAME:-}" \
              --token-stdin
          deadline=$((SECONDS + 15))
          until [[ -S "$FOUNDRY_OPT_BROKER_SOCKET" ]]; do
            (( SECONDS < deadline ))
            sleep 1
          done
          test -S "$FOUNDRY_OPT_BROKER_SOCKET"
          unset GITHUB_SETUP_TOKEN
