name: Agent CI

on:
  workflow_dispatch:
  push:
    paths:
      - agent/**
      - tests/agent/**
      - .github/workflows/agent-ci.yml
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out event code without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install pinned agent and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f agent/uv.lock ]]; then
            uv sync --project agent --frozen
          elif [[ -f agent/requirements.txt ]]; then
            uv venv agent/.venv --python 3.13
            uv pip install \
              --python agent/.venv/bin/python \
              --prerelease=allow \
              --requirement agent/requirements.txt
          else
            echo "agent/uv.lock or agent/requirements.txt is required" >&2
            exit 2
          fi
          uv pip install \
            --python agent/.venv/bin/python \
            pytest==9.0.3

      - name: Run target agent tests
        run: agent/.venv/bin/python -m pytest -q tests/agent

      - name: Compile target source and tests
        run: >-
          agent/.venv/bin/python -m compileall -q
          agent tests/agent

      - name: Construct host locally without Azure calls
        run: >-
          agent/.venv/bin/python -m pytest -q
          tests/agent/test_host.py::test_host_construction_disables_persistence_without_azure
