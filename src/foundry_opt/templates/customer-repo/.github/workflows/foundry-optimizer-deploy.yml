name: Foundry v1 Deploy Agent

on:
  push:
    branches:
      - main
    paths:
      - agent/**
      - agent/.foundry/foundry-opt.yaml
      - .foundry-opt/registry.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundry-agent-production-${{ github.repository }}-${{ vars.FOUNDRY_REPO_AGENT_ID || 'default-agent' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish repository-default bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: foundry-production
    env:
      AZURE_DEPLOYMENT_CLIENT_ID: ${{ vars.AZURE_DEPLOYMENT_CLIENT_ID }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Deploy with repository default bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'Deployment explicitly uses the repository default bundle.'
