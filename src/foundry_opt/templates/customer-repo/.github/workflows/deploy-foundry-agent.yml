name: Deploy Foundry agent version

on:
  push:
    branches:
      - main
    paths:
      - agent/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundry-agent-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish regular version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: foundry-production
    env:
      AZURE_DEPLOYMENT_CLIENT_ID: ${{ vars.AZURE_DEPLOYMENT_CLIENT_ID }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted merge context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$expected_origin"
          test "$(git remote get-url origin)" = "$expected_origin"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Record trusted deployment paths
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/foundry-opt-deploy"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root/bootstrap" "$trusted_root/artifacts"
          chmod 700 "$trusted_root" "$trusted_root/bootstrap" "$trusted_root/artifacts"
          echo "FOUNDRY_OPT_BOOTSTRAP_RECEIPT=$trusted_root/bootstrap/receipt.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_DEPLOY_ROOT=$trusted_root/artifacts" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_DEPLOY_PREFLIGHT=$trusted_root/preflight.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_DEPLOY_RESULT=$trusted_root/result.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_DEPLOY_RECEIPT=$trusted_root/deployment-receipt.json" >>"$GITHUB_ENV"

      - name: Fetch the exact shared revision
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/foundry-opt.lock.yml"
          test -f "$pin"
          value() {
            local key="$1"
            awk -F': ' -v key="$key" '$1 == key {print substr($0, length(key) + 3)}' "$pin"
          }

          repository="$(value repository_url)"
          commit="$(value commit)"
          package_path="$(value package_path)"
          skill_path="$(value skill_path)"
          lock_sha256="$(value uv_lock_sha256)"

          [[ "$repository" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          [[ "$lock_sha256" =~ ^[0-9a-f]{64}$ ]]

          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"

          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          test "$(git -C "$shared_root" rev-parse HEAD)" = "$commit"
          test "$(sha256sum "$shared_root/uv.lock" | cut -d' ' -f1)" = "$lock_sha256"

          package_root="$(cd "$shared_root/$package_path" && pwd -P)"
          skill_root="$(cd "$shared_root/$skill_path" && pwd -P)"
          case "$package_root" in "$shared_root"|"$shared_root"/*) ;; *) exit 2 ;; esac
          case "$skill_root" in "$shared_root"/*) ;; *) exit 2 ;; esac
          test -f "$package_root/pyproject.toml"
          test -d "$skill_root"
          echo "FOUNDRY_OPT_SHARED_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$package_root" >>"$GITHUB_ENV"

      - name: Install the frozen shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Verify bootstrap and target configuration
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt bootstrap verify \
            --pin .github/foundry-opt.lock.yml \
            --checkout "$FOUNDRY_OPT_SHARED_ROOT" \
            --receipt "$FOUNDRY_OPT_BOOTSTRAP_RECEIPT"
          foundry-opt validate-config \
            --repository . \
            --shared-checkout "$FOUNDRY_OPT_SHARED_ROOT"

      - name: Validate deployment preconditions
        id: preflight
        shell: bash
        run: |
          set -o pipefail
          foundry-opt deploy preflight \
            --repository . \
            --release-commit "$GITHUB_SHA" \
            --environment foundry-production |
            tee "$FOUNDRY_OPT_DEPLOY_PREFLIGHT"

      - name: Skip a superseded queued commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "superseded=true" >>"$GITHUB_OUTPUT"
            echo "Current main is $current_main; this queued deployment will not publish $GITHUB_SHA."
          else
            echo "superseded=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Publish the exact regular version
        id: publish
        if: ${{ steps.freshness.outputs.superseded == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          foundry-opt deploy publish \
            --repository . \
            --release-commit "$GITHUB_SHA" \
            --environment foundry-production \
            --receipt "$FOUNDRY_OPT_DEPLOY_RECEIPT" |
            tee "$FOUNDRY_OPT_DEPLOY_RESULT"

      - name: Upload deployment receipt
        if: ${{ steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-agent-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FOUNDRY_OPT_DEPLOY_RECEIPT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Write deployment summary
        if: ${{ always() }}
        env:
          SUPERSEDED: ${{ steps.freshness.outputs.superseded }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          receipt_path = Path(os.environ["FOUNDRY_OPT_DEPLOY_RECEIPT"])
          result_path = Path(os.environ["FOUNDRY_OPT_DEPLOY_RESULT"])
          preflight_path = Path(os.environ["FOUNDRY_OPT_DEPLOY_PREFLIGHT"])

          lines = ["# Foundry agent deployment", ""]
          if os.environ.get("SUPERSEDED") == "true":
              lines.extend(
                  [
                      "**Status:** Superseded before publication",
                      "",
                      "A newer `main` commit was already available. No Foundry version was created.",
                  ]
              )
          elif receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              if receipt.get("status") == "superseded":
                  lines.extend(
                      [
                          "**Status:** Superseded after draft validation",
                          "",
                          f"`{receipt['release_commit']}` was not published because "
                          f"`{receipt['current_main_commit']}` became current `main`.",
                      ]
                  )
              else:
                  lines.extend(
                      [
                          "**Status:** Published",
                          "",
                          "| Field | Value |",
                          "| --- | --- |",
                          f"| Repository | `{receipt['repository']}` |",
                          f"| Merge commit | `{receipt['release_commit']}` |",
                          f"| Foundry agent | `{receipt['agent_name']}` |",
                          f"| Previous version | `{receipt.get('previous_version') or 'none'}` |",
                          f"| New version | `{receipt['published_version']}` |",
                          f"| Source root | `{receipt['source_root']}` |",
                          f"| Source tree SHA-256 | `{receipt['source_tree_sha256']}` |",
                          f"| Source ZIP SHA-256 | `{receipt['source_zip_sha256']}` |",
                          f"| Reconciled retry | `{str(receipt['reconciled']).lower()}` |",
                          f"| Latest version verified | `{str(receipt['latest_verified']).lower()}` |",
                          f"| Route mutation requested | `{str(receipt['route_mutated']).lower()}` |",
                          "",
                          f"[Foundry project endpoint]({receipt['project_endpoint']})",
                          "",
                          f"[Development evaluation]({receipt['evaluation_link']})",
                          "",
                          "## Hard guardrails",
                          "",
                          "| Guardrail | Score | Required | Passed |",
                          "| --- | ---: | ---: | --- |",
                      ]
                  )
                  for guardrail in receipt["guardrails"]:
                      score = "n/a" if guardrail["score"] is None else guardrail["score"]
                      lines.append(
                          f"| `{guardrail['name']}` | {score} | "
                          f"{guardrail['required_pass_rate']} | "
                          f"{str(guardrail['passed']).lower()} |"
                      )
          else:
              error = "Deployment failed before a regular version was confirmed."
              for path in (result_path, preflight_path):
                  if not path.is_file():
                      continue
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  if isinstance(payload.get("error"), str):
                      error = payload["error"]
                      if isinstance(payload.get("published_version"), str):
                          error += (
                              f" Created regular version: "
                              f"`{payload['published_version']}`."
                          )
                      if isinstance(payload.get("evaluation_link"), str):
                          error += (
                              f" [Development evaluation]"
                              f"({payload['evaluation_link']})."
                          )
                      break
              lines.extend(["**Status:** Failed", "", error])

          lines.extend(["", f"[Open workflow run]({os.environ['WORKFLOW_URL']})", ""])
          summary.write_text("\n".join(lines), encoding="utf-8")
          PY
