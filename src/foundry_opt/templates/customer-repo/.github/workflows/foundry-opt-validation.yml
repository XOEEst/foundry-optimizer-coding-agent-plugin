name: Foundry v1 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - .foundry-opt/registry.yaml
      - agent/.foundry/foundry-opt.yaml
      - .github/ISSUE_TEMPLATE/foundry-optimize-agent.yml
      - .github/agents/foundry-optimizer.agent.md
      - .github/instructions/foundry-opt.instructions.md
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/foundry-opt-validation.yml
      - .github/workflows/foundry-opt-deploy.yml
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the target repository without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch exact v1-capable shared revision
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="ec2287506c6e6e3537f71127ead4051182b70a98"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"

      - name: Install exact shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT" --group dev
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Validate registry and protected runtime paths
        shell: bash
        run: |
          set -euo pipefail
          "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/python" - <<'PY'
          from pathlib import Path
          from foundry_opt.bootstrap.contracts import BootstrapSidecar, RootRegistry
          root = Path('.')
          registry = RootRegistry.from_document((root / '.foundry-opt' / 'registry.yaml').read_text(encoding='utf-8'))
          for agent in registry.agents:
              sidecar_path = root / agent.config_path
              if not sidecar_path.exists():
                  assert not agent.enabled, f'enabled agent sidecar is missing: {agent.config_path}'
                  continue
              sidecar = BootstrapSidecar.from_document(sidecar_path.read_text(encoding='utf-8'))
              assert all(not value.startswith('.foundry-opt/') for value in sidecar.editable_paths)
              assert all(not value.startswith('agent/.foundry/') for value in sidecar.editable_paths)
          assert (root / '.github' / 'copilot-instructions.md').exists() or True
          PY
