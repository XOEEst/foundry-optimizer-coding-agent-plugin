name: Foundry v1 Optimizer Validation

on:
  workflow_dispatch:
  push:
    paths:
      - .foundry-opt/registry.yaml
      - agent/.foundry/foundry-opt.yaml
      - .github/ISSUE_TEMPLATE/optimize-agent.yml
      - .github/agents/foundry-optimizer.agent.md
      - .github/instructions/foundry-opt.instructions.md
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/foundry-optimizer-validation.yml
      - .github/workflows/foundry-optimizer-deploy.yml
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        changed_root: [agent]
    steps:
      - name: Check out the target repository without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch the pinned shared revision
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/foundry-opt.lock.yml"
          repository="$(awk -F': ' '$1 == "repository_url" {print $2}' "$pin")"
          commit="$(awk -F': ' '$1 == "commit" {print $2}' "$pin")"
          package_path="$(awk -F': ' '$1 == "package_path" {print $2}' "$pin")"
          skill_path="$(awk -F': ' '$1 == "skill_path" {print $2}' "$pin")"
          lock_sha256="$(awk -F': ' '$1 == "uv_lock_sha256" {print $2}' "$pin")"
          [[ "$repository" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$ ]]
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          test "$(sha256sum "$shared_root/uv.lock" | cut -d' ' -f1)" = "$lock_sha256"
          echo "FOUNDRY_OPT_SHARED_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$(cd "$shared_root/$package_path" && pwd -P)" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_SKILL_SOURCE=$(cd "$shared_root/$skill_path" && pwd -P)" >>"$GITHUB_ENV"

      - name: Install the pinned shared CLI and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT" --group dev
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Validate the target repository contract
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt validate-config --repository . --shared-checkout "$FOUNDRY_OPT_SHARED_ROOT"
          test -f .github/instructions/foundry-opt.instructions.md
          test ! -f .github/copilot-instructions.md
          test "${{ matrix.changed_root }}" = "agent"
