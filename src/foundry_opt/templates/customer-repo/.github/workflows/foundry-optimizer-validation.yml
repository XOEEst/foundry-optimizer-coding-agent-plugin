name: Foundry Optimizer Validation

on:
  workflow_dispatch:
    inputs:
      run_acceptance_smoke:
        description: Run protected acceptance smoke cleanup when the pinned CLI supports it.
        required: false
        type: boolean
        default: false
  push:
    paths:
      - .github/foundry-opt.lock.yml
      - .github/foundry-optimizer.yaml
      - .foundry/agent-metadata.yaml
      - .github/ISSUE_TEMPLATE/optimize-agent.yml
      - .github/agents/foundry-optimizer.agent.md
      - .github/instructions/foundry-opt.instructions.md
      - .github/skills/foundry-agent-optimizer/**
      - .github/workflows/agent-ci.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/deploy-foundry-agent.yml
      - .github/workflows/foundry-optimizer-validation.yml
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the target repository without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch the pinned shared revision
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/foundry-opt.lock.yml"
          test -f "$pin"
          value() {
            local key="$1"
            awk -F': ' -v key="$key" '$1 == key {print substr($0, length(key) + 3)}' "$pin"
          }

          repository="$(value repository_url)"
          commit="$(value commit)"
          package_path="$(value package_path)"
          skill_path="$(value skill_path)"
          lock_sha256="$(value uv_lock_sha256)"

          [[ "$repository" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          [[ "$lock_sha256" =~ ^[0-9a-f]{64}$ ]]

          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"

          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          test "$(git -C "$shared_root" rev-parse HEAD)" = "$commit"
          test "$(sha256sum "$shared_root/uv.lock" | cut -d' ' -f1)" = "$lock_sha256"

          package_root="$(cd "$shared_root/$package_path" && pwd -P)"
          skill_root="$(cd "$shared_root/$skill_path" && pwd -P)"
          case "$package_root" in "$shared_root"|"$shared_root"/*) ;; *) exit 2 ;; esac
          case "$skill_root" in "$shared_root"/*) ;; *) exit 2 ;; esac
          test -f "$package_root/pyproject.toml"
          test -d "$skill_root"

          echo "FOUNDRY_OPT_SHARED_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$package_root" >>"$GITHUB_ENV"

      - name: Install the pinned shared CLI and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT" --group dev
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Verify the pinned shared checkout
        shell: bash
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/foundry-opt-validation"
          rm -rf "$validation_root"
          mkdir -p "$validation_root"
          foundry-opt bootstrap verify \
            --pin .github/foundry-opt.lock.yml \
            --checkout "$FOUNDRY_OPT_SHARED_ROOT" \
            --receipt "$validation_root/bootstrap-receipt.json"

      - name: Run the shared POC tests
        shell: bash
        run: |
          set -euo pipefail
          "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/python" -m pytest -q "$FOUNDRY_OPT_SHARED_ROOT/tests/poc"

      - name: Validate the target repository contract
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt validate-config \
            --repository . \
            --shared-checkout "$FOUNDRY_OPT_SHARED_ROOT"

  acceptance-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_acceptance_smoke }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: copilot
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the target repository without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Record trusted acceptance paths
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/foundry-opt-acceptance"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root/bootstrap" "$trusted_root/broker" "$trusted_root/jobs"
          chmod 700 "$trusted_root" "$trusted_root/bootstrap" "$trusted_root/broker" "$trusted_root/jobs"
          echo "FOUNDRY_OPT_BOOTSTRAP_RECEIPT=$trusted_root/bootstrap/receipt.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BROKER_SOCKET=$trusted_root/broker/github.sock" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_STATE_ROOT=$trusted_root/jobs" >>"$GITHUB_ENV"

      - name: Fetch the pinned shared revision
        shell: bash
        run: |
          set -euo pipefail
          pin=".github/foundry-opt.lock.yml"
          test -f "$pin"
          value() {
            local key="$1"
            awk -F': ' -v key="$key" '$1 == key {print substr($0, length(key) + 3)}' "$pin"
          }

          repository="$(value repository_url)"
          commit="$(value commit)"
          package_path="$(value package_path)"
          skill_path="$(value skill_path)"
          lock_sha256="$(value uv_lock_sha256)"

          [[ "$repository" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          [[ "$lock_sha256" =~ ^[0-9a-f]{64}$ ]]

          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"

          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          test "$(git -C "$shared_root" rev-parse HEAD)" = "$commit"
          test "$(sha256sum "$shared_root/uv.lock" | cut -d' ' -f1)" = "$lock_sha256"

          package_root="$(cd "$shared_root/$package_path" && pwd -P)"
          skill_root="$(cd "$shared_root/$skill_path" && pwd -P)"
          case "$package_root" in "$shared_root"|"$shared_root"/*) ;; *) exit 2 ;; esac
          case "$skill_root" in "$shared_root"/*) ;; *) exit 2 ;; esac
          test -f "$package_root/pyproject.toml"
          test -d "$skill_root"

          echo "FOUNDRY_OPT_SHARED_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$package_root" >>"$GITHUB_ENV"

      - name: Install the pinned shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Verify the pinned shared checkout and acceptance prerequisites
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt bootstrap verify \
            --pin .github/foundry-opt.lock.yml \
            --checkout "$FOUNDRY_OPT_SHARED_ROOT" \
            --receipt "$FOUNDRY_OPT_BOOTSTRAP_RECEIPT"
          foundry-opt validate-config \
            --repository . \
            --shared-checkout "$FOUNDRY_OPT_SHARED_ROOT"
          test -f "$FOUNDRY_OPT_BOOTSTRAP_RECEIPT"
          test -d "$FOUNDRY_OPT_STATE_ROOT"
          test -d "$(dirname "$FOUNDRY_OPT_BROKER_SOCKET")"
          test ! -e "$FOUNDRY_OPT_BROKER_SOCKET"

      - name: Run protected acceptance smoke cleanup
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt acceptance smoke --help | grep -q -- '--cleanup'
          foundry-opt acceptance smoke --help | grep -q -- '--issue-number'
          foundry-opt acceptance smoke --help | grep -q -- '--job-id'
          validation_issue_number=999999999
          validation_job_id="validation-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          foundry-opt acceptance smoke --cleanup \
            --repository . \
            --issue-number "$validation_issue_number" \
            --job-id "$validation_job_id"
