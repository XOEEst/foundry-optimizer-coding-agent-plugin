name: Foundry v1 Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repo_agent_id:
        description: Optional exact repoAgentId to deploy manually
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch exact shared CLI source
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="ec2287506c6e6e3537f71127ead4051182b70a98"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"

      - name: Install exact shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Compute changed enabled agents
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          if [[ -z "$base_ref" || "$base_ref" == "0000000000000000000000000000000000000000" ]]; then
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_files="$(git diff --name-only "$base_ref" "$GITHUB_SHA")"
          export CHANGED_FILES_RAW="$changed_files"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP']).joinpath('foundry-opt-changed-files.txt').write_text(os.environ['CHANGED_FILES_RAW'], encoding='utf-8')
          PY
          "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          from foundry_opt.bootstrap.contracts import BootstrapSidecar, RootRegistry
          root = Path('.')
          changed = {line.strip() for line in os.environ['CHANGED_FILES_RAW'].splitlines() if line.strip()}
          manual_repo_agent_id = os.environ.get('MANUAL_REPO_AGENT_ID', '').strip()
          registry = RootRegistry.from_document((root / '.foundry-opt' / 'registry.yaml').read_text(encoding='utf-8'))
          include = []
          enabled = [agent for agent in registry.agents if agent.enabled]
          if manual_repo_agent_id:
              selected = [agent for agent in enabled if agent.agent_id == manual_repo_agent_id]
              if len(selected) != 1:
                  raise SystemExit('manual repo_agent_id must match exactly one enabled registry agent')
              agent = selected[0]
              include.append({'changed_root': agent.root, 'repo_agent_id': agent.agent_id, 'config_path': agent.config_path})
          else:
              shared_contract_changed = any(path.startswith('.foundry-opt/') or path.startswith('.github/workflows/') for path in changed)
              roots_by_id = {agent.agent_id: agent.root for agent in enabled}
              for agent in enabled:
                  sidecar = BootstrapSidecar.from_document((root / agent.config_path).read_text(encoding='utf-8'))
                  relations = {relation.agent_id for relation in sidecar.shared_source_relations}
                  candidate_paths = {agent.config_path, f"{agent.root}/", *(f"{roots_by_id[related]}/" for related in relations if related in roots_by_id)}
                  if shared_contract_changed or any(path == agent.config_path or any(path.startswith(prefix) for prefix in candidate_paths) for path in changed):
                      include.append({'changed_root': agent.root, 'repo_agent_id': agent.agent_id, 'config_path': agent.config_path})
          matrix = {'include': include}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"matrix={json.dumps(matrix)}\n")
          PY
        env:
          MANUAL_REPO_AGENT_ID: ""

  deploy:
    needs: discover
    if: ${{ toJson(fromJson(needs.discover.outputs.matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: foundry-production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    concurrency:
      group: foundry-opt-${{ github.repository }}-${{ matrix.repo_agent_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_OPT_DEPLOYMENT_CLIENT_ID: ${{ vars.AZURE_OPTIMIZER_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch exact shared CLI source
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="ec2287506c6e6e3537f71127ead4051182b70a98"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"

      - name: Install exact shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Check deployment eligibility and exact commit packaging
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          foundry-opt deploy plan \
            --repository . \
            --changed-root "${{ matrix.changed_root }}" \
            --repo-agent-id "${{ matrix.repo_agent_id }}" \
            --sidecar "${{ matrix.config_path }}" \
            --exact-source "$GITHUB_SHA" \
            --check-eligibility \
            --use-repository-default-evaluators

      - name: Evaluate and publish the exact registered agent
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/foundry-opt-deployment-${{ matrix.repo_agent_id }}.json"
          foundry-opt deploy publish-registered \
            --repository . \
            --repo-agent-id "${{ matrix.repo_agent_id }}" \
            --exact-source "$GITHUB_SHA" \
            --receipt "$receipt"
          {
            echo "### Foundry deployment: ${{ matrix.repo_agent_id }}"
            echo '```json'
            cat "$receipt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
