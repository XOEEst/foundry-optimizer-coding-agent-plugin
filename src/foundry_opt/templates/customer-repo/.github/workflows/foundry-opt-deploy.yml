name: Foundry v1 Deploy

on:
  push:
    branches:
      - main
    paths:
      - .foundry-opt/registry.yaml
      - agent/**
      - agent/.foundry/foundry-opt.yaml
      - .github/workflows/foundry-opt-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch exact shared CLI source
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="c899b718f3baebcfd08209ee5184d0cf61d8153d"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"

      - name: Install exact shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Compute changed enabled roots
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          if [[ -z "$base_ref" || "$base_ref" == "0000000000000000000000000000000000000000" ]]; then
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_files="$(git diff --name-only "$base_ref" "$GITHUB_SHA")"
          printf 'CHANGED_FILES<<EOF\n%s\nEOF\n' "$changed_files" >>"$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from foundry_opt.bootstrap.contracts import RootRegistry
          root = Path('.')
          changed = {line.strip() for line in os.environ['CHANGED_FILES'].splitlines() if line.strip()}
          registry = RootRegistry.from_document((root / '.foundry-opt' / 'registry.yaml').read_text(encoding='utf-8'))
          shared_contract_changed = any(path.startswith('.foundry-opt/') or path.startswith('.github/workflows/') for path in changed)
          roots = []
          for agent in registry.agents:
              if not agent.enabled:
                  continue
              if shared_contract_changed or any(path == agent.config_path or path.startswith(f"{agent.root}/") for path in changed):
                  roots.append({'changed_root': agent.root, 'repo_agent_id': agent.agent_id, 'config_path': agent.config_path})
          if not roots:
              roots.append({'changed_root': 'agent', 'repo_agent_id': 'example-agent', 'config_path': 'agent/.foundry/foundry-opt.yaml'})
          from pathlib import Path
          github_output = Path(os.environ['GITHUB_OUTPUT'])
          with github_output.open('a', encoding='utf-8') as handle:
              handle.write(f"matrix={json.dumps({'include': roots})}\n")
          PY

  deploy:
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: foundry-production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    concurrency:
      group: foundry-opt-${{ github.repository }}-${{ matrix.repo_agent_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_DEPLOYMENT_CLIENT_ID: ${{ vars.AZURE_DEPLOYMENT_CLIENT_ID }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch exact shared CLI source
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="c899b718f3baebcfd08209ee5184d0cf61d8153d"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"

      - name: Install exact shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Check deployment eligibility and exact commit packaging
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          foundry-opt deploy plan             --repository .             --changed-root "${{ matrix.changed_root }}"             --repo-agent-id "${{ matrix.repo_agent_id }}"             --sidecar "${{ matrix.config_path }}"             --exact-source "$GITHUB_SHA"             --check-eligibility             --use-repository-default-evaluators
