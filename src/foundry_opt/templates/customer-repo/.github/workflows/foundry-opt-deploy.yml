name: Foundry v1 Deploy

on:
  push:
    branches:
      - main
    paths:
      - .foundry-opt/registry.yaml
      - agent/**
      - agent/.foundry/foundry-opt.yaml
      - .github/workflows/foundry-opt-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - name: Emit changed-root matrix
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          printf 'roots=["agent"]\n' >>"$GITHUB_OUTPUT"

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: foundry-production
    strategy:
      fail-fast: false
      matrix:
        changed_root: ${{ fromJson(needs.discover.outputs.roots) }}
    concurrency:
      group: foundry-opt-${{ github.repository }}-${{ matrix.changed_root }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_DEPLOYMENT_CLIENT_ID: ${{ vars.AZURE_DEPLOYMENT_CLIENT_ID }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Check deployment eligibility and resolve agent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ matrix.changed_root }}" = "agent"
          python - <<'PY'
          import pathlib, yaml
          root = pathlib.Path('.')
          registry = yaml.safe_load((root / '.foundry-opt' / 'registry.yaml').read_text(encoding='utf-8'))
          agent = next(item for item in registry['agents'] if item['root'] == 'agent')
          sidecar = yaml.safe_load((root / agent['config_path']).read_text(encoding='utf-8'))
          assert sidecar['deployment']['enabled'] is True
          assert sidecar['default_evaluator_bundle']['definitions']
          assert sidecar['default_evaluator_bundle']['datasets']
          print(f"repo_agent_id={agent['agent_id']}")
          PY

      - name: Fetch exact shared CLI source
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="c899b71"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"

      - name: Install exact shared CLI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"

      - name: Dispatch repository-default deploy contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'Planned future CLI call: foundry-opt deploy dispatch --repository . --changed-root "${{ matrix.changed_root }}" --use-repository-default-evaluators --check-eligibility --exact-source "$GITHUB_SHA"'
