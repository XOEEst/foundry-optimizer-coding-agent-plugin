name: Foundry v1 Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .foundry-opt/bootstrap.lock.json
      - .foundry-opt/registry.yaml
      - '**/.foundry/foundry-opt.yaml'

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the agent repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Canonicalize the repository origin
        shell: bash
        run: |
          set -euo pipefail
          expected_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$expected_origin"
          test "$(git remote get-url origin)" = "$expected_origin"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Fetch exact v1-capable shared revision
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="7972654051b9cce644836c69ef94a43c0f68ded1"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          resolved_commit="$(git -C "$shared_root" rev-parse HEAD)"
          test "$resolved_commit" = "$commit"
          echo "FOUNDRY_OPT_SHARED_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_SKILL_SOURCE=$shared_root/src/foundry_opt/templates/skills/foundry-agent-optimizer" >>"$GITHUB_ENV"

      - name: Install the exact shared CLI and skill
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          launcher_root="$HOME/.local/bin"
          mkdir -p "$launcher_root"
          export FOUNDRY_OPT_EXECUTABLE="$launcher_root/foundry-opt"
          ln -sf "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/foundry-opt" "$FOUNDRY_OPT_EXECUTABLE"
          chmod 755 "$FOUNDRY_OPT_EXECUTABLE"
          echo "FOUNDRY_OPT_EXECUTABLE=$FOUNDRY_OPT_EXECUTABLE" >>"$GITHUB_ENV"
          echo "$launcher_root" >>"$GITHUB_PATH"
          echo "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin" >>"$GITHUB_PATH"
          skill_root="$HOME/.copilot/skills/foundry-agent-optimizer"
          rm -rf "$skill_root"
          mkdir -p "$(dirname "$skill_root")"
          cp -a "$FOUNDRY_OPT_SKILL_SOURCE" "$skill_root"

      - name: Record trusted state paths
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/foundry-opt-trusted"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root/bootstrap" "$trusted_root/broker" "$trusted_root/jobs"
          chmod 700 "$trusted_root" "$trusted_root/bootstrap" "$trusted_root/broker" "$trusted_root/jobs"
          echo "FOUNDRY_OPT_TRUSTED_ROOT=$trusted_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BOOTSTRAP_RECEIPT=$trusted_root/bootstrap/receipt.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_GITHUB_BINDING=$trusted_root/broker/binding.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BROKER_SOCKET=$trusted_root/broker/github.sock" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_STATE_ROOT=$trusted_root/jobs" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_RUNTIME_SHA=7972654051b9cce644836c69ef94a43c0f68ded1" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_RESUME_RECORD=$trusted_root/resume.json" >>"$GITHUB_ENV"

      - name: Validate bootstrap contracts and registry sidecars
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt bootstrap verify --registry .foundry-opt/registry.yaml --uv-lock-sha256 74d7bb534c53e71a61ce197f3d5fa3169f2413373c2e42617280e78e83d6c681 --checkout "$FOUNDRY_OPT_SHARED_ROOT" --receipt "$FOUNDRY_OPT_BOOTSTRAP_RECEIPT"
          "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/python" - <<'PY'
          from pathlib import Path
          from foundry_opt.bootstrap.contracts import BootstrapSidecar, RootRegistry
          root = Path('.')
          registry = RootRegistry.from_document((root / '.foundry-opt' / 'registry.yaml').read_text(encoding='utf-8'))
          protected = ['.foundry-opt/'] + [agent.config_path for agent in registry.agents]
          for agent in registry.agents:
              sidecar_path = root / agent.config_path
              if not sidecar_path.exists():
                  assert not agent.enabled, f'enabled agent sidecar is missing: {agent.config_path}'
                  continue
              sidecar = BootstrapSidecar.from_document(sidecar_path.read_text(encoding='utf-8'))
              for editable in sidecar.editable_paths:
                  assert editable != '.foundry-opt/**'
                  assert not editable.startswith('.foundry-opt/')
                  for protected_path in protected:
                      assert not editable.startswith(protected_path.rstrip('*'))
          PY

      - name: Detect trusted issue context
        id: job-context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            echo 'trusted=true' >>"$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "issues" || "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            echo 'trusted=true' >>"$GITHUB_OUTPUT"
          else
            echo 'trusted=false' >>"$GITHUB_OUTPUT"
          fi

      - name: Launch and verify broker lifecycle
        if: ${{ steps.job-context.outputs.trusted == 'true' }}
        env:
          GITHUB_SETUP_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SETUP_TOKEN" | foundry-opt broker launch --event "$GITHUB_EVENT_PATH" --binding "$FOUNDRY_OPT_GITHUB_BINDING" --socket "$FOUNDRY_OPT_BROKER_SOCKET" --head-ref "${GITHUB_HEAD_REF:-}" --ref-name "${GITHUB_REF_NAME:-}" --token-stdin
          "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/python" - <<'PY'
          import os, time
          from pathlib import Path
          socket_path = Path(os.environ['FOUNDRY_OPT_BROKER_SOCKET'])
          deadline = time.time() + 15
          while time.time() < deadline and not socket_path.exists():
              time.sleep(0.2)
          assert socket_path.exists(), 'broker socket not ready'
          PY
          unset GITHUB_SETUP_TOKEN

      - name: Run offline preflight without broker
        if: ${{ steps.job-context.outputs.trusted != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          unset FOUNDRY_OPT_GITHUB_BINDING
          unset FOUNDRY_OPT_BROKER_SOCKET
          foundry-opt preflight --repository . --offline

      - name: Persist resume metadata
        shell: bash
        run: |
          set -euo pipefail
          "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['FOUNDRY_OPT_RESUME_RECORD']).write_text(json.dumps({'runtime_sha': os.environ['FOUNDRY_OPT_RUNTIME_SHA'], 'state_root': os.environ['FOUNDRY_OPT_STATE_ROOT'], 'broker_socket': os.environ.get('FOUNDRY_OPT_BROKER_SOCKET')}, indent=2), encoding='utf-8')
          PY
