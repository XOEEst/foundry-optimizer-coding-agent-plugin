name: Foundry v1 Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/foundry-opt.lock.yml
      - .foundry-opt/registry.yaml
      - agent/.foundry/foundry-opt.yaml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the agent repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Canonicalize the repository origin
        shell: bash
        run: |
          set -euo pipefail
          expected_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$expected_origin"
          test "$(git remote get-url origin)" = "$expected_origin"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Record trusted state paths
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/foundry-opt-trusted"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root/bootstrap" "$trusted_root/broker" "$trusted_root/jobs"
          chmod 700 "$trusted_root" "$trusted_root/bootstrap" "$trusted_root/broker" "$trusted_root/jobs"
          echo "FOUNDRY_OPT_TRUSTED_ROOT=$trusted_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BOOTSTRAP_RECEIPT=$trusted_root/bootstrap/receipt.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_GITHUB_BINDING=$trusted_root/broker/binding.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BROKER_SOCKET=$trusted_root/broker/github.sock" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BROKER_READY=$trusted_root/broker/ready.json" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_BROKER_LIFETIME=$trusted_root/broker/lifetime.txt" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_STATE_ROOT=$trusted_root/jobs" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_RUNTIME_SHA=$trusted_root/runtime-sha.txt" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_RESUME_RECORD=$trusted_root/resume.json" >>"$GITHUB_ENV"

      - name: Fetch exact v1-capable shared revision
        shell: bash
        run: |
          set -euo pipefail
          repository="https://github.com/XOEEst/foundry-optimizer-coding-agent-plugin.git"
          commit="c899b71"
          shared_root="$RUNNER_TEMP/foundry-opt-shared"
          rm -rf "$shared_root"
          git init "$shared_root"
          git -C "$shared_root" remote add origin "$repository"
          git -C "$shared_root" fetch --depth=1 origin "$commit"
          git -C "$shared_root" checkout --detach FETCH_HEAD
          resolved_commit="$(git -C "$shared_root" rev-parse HEAD)"
          printf '%s' "$resolved_commit" >"$FOUNDRY_OPT_RUNTIME_SHA"
          test -f "$shared_root/pyproject.toml"
          test -d "$shared_root/src/foundry_opt/templates/skills/foundry-agent-optimizer"
          echo "FOUNDRY_OPT_SHARED_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_PACKAGE_ROOT=$shared_root" >>"$GITHUB_ENV"
          echo "FOUNDRY_OPT_SKILL_SOURCE=$shared_root/src/foundry_opt/templates/skills/foundry-agent-optimizer" >>"$GITHUB_ENV"

      - name: Install the exact shared CLI and skill
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project "$FOUNDRY_OPT_PACKAGE_ROOT"
          launcher_root="$HOME/.local/bin"
          mkdir -p "$launcher_root"
          export FOUNDRY_OPT_EXECUTABLE="$launcher_root/foundry-opt"
          ln -sf "$FOUNDRY_OPT_PACKAGE_ROOT/.venv/bin/foundry-opt" "$FOUNDRY_OPT_EXECUTABLE"
          chmod 755 "$FOUNDRY_OPT_EXECUTABLE"
          echo "FOUNDRY_OPT_EXECUTABLE=$FOUNDRY_OPT_EXECUTABLE" >>"$GITHUB_ENV"
          echo "$launcher_root" >>"$GITHUB_PATH"
          skill_root="$HOME/.copilot/skills/foundry-agent-optimizer"
          rm -rf "$skill_root"
          mkdir -p "$(dirname "$skill_root")"
          cp -a "$FOUNDRY_OPT_SKILL_SOURCE" "$skill_root"

      - name: Verify bootstrap, registry, and sidecar payloads
        shell: bash
        run: |
          set -euo pipefail
          foundry-opt bootstrap verify --pin .github/foundry-opt.lock.yml --checkout "$FOUNDRY_OPT_SHARED_ROOT" --receipt "$FOUNDRY_OPT_BOOTSTRAP_RECEIPT"
          python - <<'PY'
          import pathlib
          import yaml
          root = pathlib.Path('.')
          registry = yaml.safe_load((root / '.foundry-opt' / 'registry.yaml').read_text(encoding='utf-8'))
          assert registry['agents'], 'registry must list agents'
          for agent in registry['agents']:
              config = root / agent['config_path']
              sidecar = yaml.safe_load(config.read_text(encoding='utf-8'))
              assert sidecar['repo_agent_id'] == agent['agent_id']
              assert '.foundry-opt/' not in '\n'.join(sidecar['editable_paths'])
              assert 'agent/.foundry/' not in '\n'.join(sidecar['editable_paths'])
          PY

      - name: Launch and verify broker lifecycle
        env:
          GITHUB_SETUP_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SETUP_TOKEN" | foundry-opt broker launch --event "$GITHUB_EVENT_PATH" --binding "$FOUNDRY_OPT_GITHUB_BINDING" --socket "$FOUNDRY_OPT_BROKER_SOCKET" --token-stdin
          python - <<'PY'
          import json, os, socket, time
          from pathlib import Path
          sock = Path(os.environ['FOUNDRY_OPT_BROKER_SOCKET'])
          deadline = time.time() + 15
          while time.time() < deadline and not sock.exists():
              time.sleep(0.2)
          assert sock.exists(), 'broker socket not created'
          Path(os.environ['FOUNDRY_OPT_BROKER_READY']).write_text(json.dumps({'socket': str(sock), 'ready': True}), encoding='utf-8')
          Path(os.environ['FOUNDRY_OPT_BROKER_LIFETIME']).write_text('session', encoding='utf-8')
          PY
          unset GITHUB_SETUP_TOKEN

      - name: Persist resume metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['FOUNDRY_OPT_RESUME_RECORD']).write_text(json.dumps({'runtime_sha_path': os.environ['FOUNDRY_OPT_RUNTIME_SHA'], 'state_root': os.environ['FOUNDRY_OPT_STATE_ROOT'], 'broker_socket': os.environ['FOUNDRY_OPT_BROKER_SOCKET'], 'broker_ready': os.environ['FOUNDRY_OPT_BROKER_READY']}, indent=2), encoding='utf-8')
          PY
