schema_version: 1

repository_identity: example-org/example-agent
repository_id: 123456789
default_branch: main

project_endpoint: https://example.services.ai.azure.com/api/projects/example
foundry_account_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example/providers/Microsoft.CognitiveServices/accounts/example
agent_name: example-agent

authentication_method: oidc
static_credentials_allowed: false

hosted_runtime:
  kind: hosted
  runtime: python_3_13
  entry_point:
    - python
    - main.py
  dependency_resolution: remote_build
  protocol_name: responses
  protocol_version: "2.0.0"
  cpu: "0.5"
  memory: 1Gi
  model_environment_variable: AZURE_AI_MODEL_DEPLOYMENT_NAME

oidc:
  issuer: https://token.actions.githubusercontent.com
  audience: api://AzureADTokenExchange
  tenant_id: 00000000-0000-0000-0000-000000000000
  subscription_id: 00000000-0000-0000-0000-000000000000
  repository_id_claim: "123456789"
  workflow_variables:
    - alias: optimizer_client_id
      name: AZURE_OPTIMIZER_CLIENT_ID
      value: 11111111-1111-1111-1111-111111111111
      scope: repository
    - alias: deployment_client_id
      name: AZURE_DEPLOYMENT_CLIENT_ID
      value: 22222222-2222-2222-2222-222222222222
      scope: environment
      environment: foundry-production
  principals:
    - role: optimizer
      client_id: 11111111-1111-1111-1111-111111111111
      client_id_variable: optimizer_client_id
      environment: copilot
      subject: repo:example-org/example-agent:environment:copilot
      direct_oidc_subject: repo:example-org/example-agent:environment:copilot
    - role: deployment
      client_id: 22222222-2222-2222-2222-222222222222
      client_id_variable: deployment_client_id
      environment: foundry-production
      subject: repo:example-org/example-agent:environment:foundry-production
      direct_oidc_subject: repo:example-org/example-agent:environment:foundry-production

model_deployments:
  - alias: baseline-model
    deployment_name: baseline-model
    model_format: OpenAI
    model_name: baseline-model
    model_version: "1"
    required_capabilities:
      - name: responses
        enabled: true

development_evaluation:
  name: development
  split: development
  resolved_evaluation_id: eval_development
  dataset_id: azureai://accounts/example/projects/example/data/development/versions/1
  custom_evaluator_ids:
    - azureai://accounts/example/projects/example/evaluators/quality/versions/1
    - azureai://accounts/example/projects/example/evaluators/safety/versions/1

validating_evaluation:
  name: validating
  split: validating
  resolved_evaluation_id: eval_validating
  dataset_id: azureai://accounts/example/projects/example/data/validating/versions/1
  custom_evaluator_ids:
    - azureai://accounts/example/projects/example/evaluators/quality/versions/1
    - azureai://accounts/example/projects/example/evaluators/safety/versions/1
