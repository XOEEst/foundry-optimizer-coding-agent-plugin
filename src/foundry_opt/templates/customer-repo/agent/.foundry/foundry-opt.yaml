schema_version: 2
repo_agent_id: example-agent
source_root: agent
package_root: agent
editable_paths:
  - agent/main.py
  - agent/prompts/**
  - tests/agent/**
shared_source_relations: []
runtime:
  schema_version: 1
  kind: hosted
  runtime: python_3_13
  entrypoint:
    - python
    - main.py
  dependency_resolution: remote_build
  protocol_name: responses
  protocol_version: "2.0.0"
  cpu: "0.5"
  memory: 1Gi
  model_environment_variable: AZURE_AI_MODEL_DEPLOYMENT_NAME
foundry_project:
  schema_version: 1
  project_endpoint: https://example.services.ai.azure.com/api/projects/example
  account_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example/providers/Microsoft.CognitiveServices/accounts/example
  agent_name: example-agent
  model_deployment_aliases:
    - baseline-model
baseline_model: baseline-model
allowed_models:
  - baseline-model
min_candidates: 2
max_candidates: 2
primary_metric: primary_metric
decision_policy:
  schema_version: 1
  minimum_aggregate_delta: 0.01
  focused_cases_required: true
  max_regressions: 0
max_issue_evaluators: 8
hard_guardrails:
  - schema_version: 1
    evaluator_name: violence
    required_pass_rate: 1.0
    required: true
  - schema_version: 1
    evaluator_name: sexual
    required_pass_rate: 1.0
    required: true
  - schema_version: 1
    evaluator_name: self_harm
    required_pass_rate: 1.0
    required: true
  - schema_version: 1
    evaluator_name: hate_unfairness
    required_pass_rate: 1.0
    required: true
  - schema_version: 1
    evaluator_name: indirect_attack
    required_pass_rate: 1.0
    required: true
deployment:
  schema_version: 1
  environment: foundry-production
  enabled: true
  require_aligned_binding: true
verification:
  schema_version: 1
  mode: "off"
  bundle: null
  lineage: null
