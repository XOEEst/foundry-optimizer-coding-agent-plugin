schema_version: 1
manifest_id: foundry-v1-managed-payloads
manifest_version: 1.0.0
managed_payloads:
- schema_version: 1
  template_id: registry
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.foundry-opt/registry.yaml
  destination_path: .foundry-opt/registry.yaml
  ownership_mode: owned
  semantic_patch_mode: none
  scope: repository
  required: true
- schema_version: 1
  template_id: sidecar
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/agent/.foundry/foundry-opt.yaml
  destination_path: '{selected.root}/.foundry/foundry-opt.yaml'
  ownership_mode: owned
  semantic_patch_mode: none
  scope: agent
  required: true
- schema_version: 1
  template_id: optimizer-instruction
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.github/instructions/foundry-opt.instructions.md
  destination_path: .github/instructions/foundry-opt.instructions.md
  ownership_mode: owned
  semantic_patch_mode: none
  scope: repository
  required: true
- schema_version: 1
  template_id: optimizer-issue-form
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.github/ISSUE_TEMPLATE/foundry-optimize-agent.yml
  destination_path: .github/ISSUE_TEMPLATE/foundry-optimize-agent.yml
  ownership_mode: owned
  semantic_patch_mode: none
  scope: repository
  required: true
- schema_version: 1
  template_id: custom-agent
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.github/agents/foundry-optimizer.agent.md
  destination_path: .github/agents/foundry-optimizer.agent.md
  ownership_mode: owned
  semantic_patch_mode: none
  scope: repository
  required: true
- schema_version: 1
  template_id: setup-semantic-patch
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.github/workflows/copilot-setup-steps.yml
  destination_path: .github/workflows/copilot-setup-steps.yml
  ownership_mode: shared-template
  semantic_patch_id: setup-v1-bootstrap
  semantic_patch_mode: apply
  scope: shared-runtime
  required: true
- schema_version: 1
  template_id: validation-workflow
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.github/workflows/foundry-opt-validation.yml
  destination_path: .github/workflows/foundry-opt-validation.yml
  ownership_mode: owned
  semantic_patch_mode: none
  scope: repository
  required: true
- schema_version: 1
  template_id: deploy-workflow
  template_version: 1.0.0
  source_template_path: src/foundry_opt/templates/customer-repo/.github/workflows/foundry-opt-deploy.yml
  destination_path: .github/workflows/foundry-opt-deploy.yml
  ownership_mode: owned
  semantic_patch_mode: none
  scope: repository
  required: true
